<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Island Fix — modelli (personaggi e strumenti)</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #cfe3e6; font-family: system-ui, sans-serif; }
      canvas { display: block; width: 100%; height: 100%; }
      #bar { position: fixed; left: 8px; top: 8px; display: flex; flex-wrap: wrap; gap: 4px; max-width: 70vw; opacity: 0.85; }
      #bar button { font-size: 11px; padding: 3px 7px; border-radius: 6px; border: 1px solid #0003; background: #fffd; cursor: pointer; }
      #info { position: fixed; right: 8px; top: 8px; font-size: 11px; background: #fffb; padding: 4px 8px; border-radius: 6px; white-space: pre; }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="bar"></div>
    <div id="info"></div>
    <script type="module" src="/src/dev/models-demo.ts"></script>
  </body>
</html>
